
name: V4Career Daily Job Scraping

on:
  schedule:
    # Daily at 7:00 AM IST (01:30 UTC)
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4career-daily-scraping
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./V4Career

    env:
      DB_ENGINE: postgres
      NEON_HOST: ${{ secrets.NEON_HOST }}
      NEON_PORT: ${{ secrets.NEON_PORT }}
      NEON_DB: ${{ secrets.NEON_DB }}
      NEON_USER: ${{ secrets.NEON_USER }}
      NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}
      NEON_SSLMODE: require
      
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

      # Actor IDs — configure these GitHub secrets for the portals you use
      APIFY_ACTOR_FOUNDIT: ${{ secrets.APIFY_ACTOR_FOUNDIT }}
      APIFY_ACTOR_GLASSDOOR: ${{ secrets.APIFY_ACTOR_GLASSDOOR }}
      APIFY_ACTOR_INDEED: ${{ secrets.APIFY_ACTOR_INDEED }}
      APIFY_ACTOR_INTERNSHALA: ${{ secrets.APIFY_ACTOR_INTERNSHALA }}
      APIFY_ACTOR_NAUKRI: ${{ secrets.APIFY_ACTOR_NAUKRI }}
      APIFY_ACTOR_TIMESJOBS: ${{ secrets.APIFY_ACTOR_TIMESJOBS }}
      APIFY_ACTOR_WELLFOUND: ${{ secrets.APIFY_ACTOR_WELLFOUND }}

      # Explicit approval flags — set to true only for reviewed Actors
      APIFY_ACCESS_APPROVED_FOUNDIT: ${{ secrets.APIFY_ACCESS_APPROVED_FOUNDIT }}
      APIFY_ACCESS_APPROVED_GLASSDOOR: ${{ secrets.APIFY_ACCESS_APPROVED_GLASSDOOR }}
      APIFY_ACCESS_APPROVED_INDEED: ${{ secrets.APIFY_ACCESS_APPROVED_INDEED }}
      APIFY_ACCESS_APPROVED_INTERNSHALA: ${{ secrets.APIFY_ACCESS_APPROVED_INTERNSHALA }}
      APIFY_ACCESS_APPROVED_NAUKRI: ${{ secrets.APIFY_ACCESS_APPROVED_NAUKRI }}
      APIFY_ACCESS_APPROVED_TIMESJOBS: ${{ secrets.APIFY_ACCESS_APPROVED_TIMESJOBS }}
      APIFY_ACCESS_APPROVED_WELLFOUND: ${{ secrets.APIFY_ACCESS_APPROVED_WELLFOUND }}

      PYTHONUNBUFFERED: "1"


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: V4Career/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate database secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in NEON_HOST NEON_PORT NEON_DB NEON_USER NEON_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub secret: $key"
              exit 1
            fi
          done

      - name: Scrape configured job portals
        id: portals
        continue-on-error: true
        run: |
          python scripts/run_configured_sources.py \
            --keyword "Software Engineer" \
            --location India \
            --max-results 10

      - name: Scrape official company career pages
        id: companies
        continue-on-error: true
        run: |
          python scripts/run_company_careers_structured_batch.py \
            --max-results 10 \
            --max-pages 10 \
            --timeout 10 \
            --workers 2

      - name: Report collection status
        if: always()
        env:
          PORTAL_RESULT: ${{ steps.portals.outcome }}
          COMPANY_RESULT: ${{ steps.companies.outcome }}
        shell: bash
        run: |
          echo "Job portal scraping: ${PORTAL_RESULT:-not run}"
          echo "Company career scraping: ${COMPANY_RESULT:-not run}"

          if [[ "$PORTAL_RESULT" != "success" ||
                "$COMPANY_RESULT" != "success" ]]; then
            echo "::error::One or more scraping stages failed. Review their logs."
            exit 1
          fi
