name: V4Career Daily Free Company Scrape

on:
  schedule:
    # 01:30 UTC = 07:00 India Standard Time (IST)
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4career-daily-scrape
  cancel-in-progress: false

jobs:
  scrape-official-company-careers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./V4Career

    env:
      DB_ENGINE: postgres
      NEON_HOST: ${{ secrets.NEON_HOST }}
      NEON_PORT: ${{ secrets.NEON_PORT }}
      NEON_DB: ${{ secrets.NEON_DB }}
      NEON_USER: ${{ secrets.NEON_USER }}
      NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}
      NEON_SSLMODE: require
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: V4Career/requirements.txt

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate Neon configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in NEON_HOST NEON_PORT NEON_DB NEON_USER NEON_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub Actions secret for $key"
              exit 1
            fi
          done

      - name: Scrape official company career pages
        run: >-
          python scripts/run_company_careers_structured_batch.py
          --max-results 10
          --max-pages 10
          --timeout 10
          --workers 2
